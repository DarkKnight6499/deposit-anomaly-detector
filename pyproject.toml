[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deposit-anomaly-detector"
version = "0.1.0"
description = "Detector for abnormal deposit outflows and liquidity stress signals on synthetic data, with baselines, time-series validation, interpretability and monitoring."
readme = "README.md"
requires-python = ">=3.11"
authors = []
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "shap>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]
